      /* Rotate prompt (11-04, Allen: a phone opened upright shows the game as a thin strip). Only

      #rotate .sub {
        font-size: 18px;
        font-weight: 500;
        color: #cfc4f2;
      }
      #rotate svg {
        width: 120px;
        height: 120px;
        animation: sp-rotate 2.4s ease-in-out infinite;
      }
      @keyframes sp-rotate {
        0%, 20% { transform: rotate(0deg); }
